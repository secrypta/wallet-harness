[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# solc version is auto-detected per file: our sources compile at 0.8.24, vendored
# OpenZeppelin v5.1.0 at ^0.8.20, and vendored Uniswap Permit2 pins an exact 0.8.17.
# A single pinned solc_version cannot satisfy Permit2's exact pragma, so we let Foundry
# pick a compatible compiler per source and link at the bytecode level.
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
# via_ir required to compile the vendored Uniswap Permit2 (its permitWitnessTransferFrom
# path hits stack-too-deep under the legacy pipeline; Uniswap's own foundry.toml sets it).
via_ir = true

# Toy contracts for the wallet-drain corpus. Built and run only inside Docker
# (see harness/run.sh). Never deploy these to a real network.
